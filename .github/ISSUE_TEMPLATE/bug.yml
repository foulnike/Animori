name: Ошибка
description: Что-то работает не так — на ПК, на приставке, на телефоне или сразу на нескольких
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашли время на отчёт. Чем точнее заполнены поля, тем быстрее найдётся причина.
        Продуктов три — настольное приложение, приставка и телефон, — и первый вопрос в форме как раз об этом.
  - type: dropdown
    id: product
    attributes:
      label: Где сломалось
      description: |
        Общее ядро — то, что в каталоге `packages/core`, — правки идут сразу во все приложения,
        и такая ошибка видна на всех. Не гадайте: «несколько» честнее, чем «кажется, только на ПК».
      options:
        - Настольное приложение (Windows)
        - Приставка (Android TV)
        - Телефон (Android)
        - На нескольких
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: |
        Настройки, раздел «О программе». На приставке тот же номер стоит внизу рельса.
        Укажите свою, а не последнюю: разница между ними — половина разбира.
      placeholder: 3.1.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: |
        На ПК — версия Windows и установлен ли WebView2.
        На Android (приставка и телефон) — модель, версия Android и разрядность:
        `adb shell getprop ro.product.cpu.abi`.
      placeholder: |
        ПК: Windows 11 23H2, WebView2 установлен.
        Приставка: Haier Android TV, Android 14, armeabi-v7a.
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Экран
      description: |
        Подпись экрана тайтла на ПК — «Аниме», на приставке — «Тайтл», это один и тот же экран.
        Статистика есть только на ПК.
      options:
        - Главная
        - Моё
        - Статистика (только ПК)
        - История
        - Поиск
        - Аниме / Тайтл
        - Студия
        - Просмотр
        - Настройки
        - Журнал отладки
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что делали, чего ждали, что получилось
      description: |
        Пошагово, даже если шагов всего два. Если поломка видна на экране — приложите снимок:
        на ПК перетащите его сюда, на приставке снимок сделайте телефоном.
      placeholder: |
        1. Открыл карточку тайтла.
        2. Нажал «Смотреть».
        Ждал плеер, получил пустое окно.
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Прокси
      description: |
        Настройки, плитка «Прокси», тумблер «Использовать прокси».
        Прокси меняет путь всех запросов, и без этого поля половина сетевых жалоб неразбираема.
      placeholder: выключен
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал отладки
      description: |
        На ПК: «Настройки → Отладка → Журнал отладки», пригодится и «Консоль разработчика».
        Там есть версия, система и маршрут каждой записи.
        На телефоне журнал открывается адресом `#/log`.
        На приставке поле оставьте пустым: из интерфейса журнал не открывается, а в обычной
        сборке Android его записи в `logcat` не отдаёт. Если снимали сбой на отладочной сборке,
        пришлите `adb logcat` — это дороже всего остального.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Стоит последняя версия AniMori
          required: true
        - label: Поиск по существующим issue ничего похожего не дал
          required: true
