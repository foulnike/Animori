name: Идея
description: Предложение по новой возможности или улучшению — на ПК, на приставке, на телефоне или сразу на нескольких
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Опишите сначала задачу, а потом желаемое решение: часто у задачи есть путь короче.
        Приложений два — настольное и приставка, — и одна и та же идея обычно касается обоих.
  - type: dropdown
    id: product
    attributes:
      label: Где это нужно
      description: |
        Общее ядро — то, что в каталоге `packages/core`, — попадает в оба приложения сразу.
        Если идея касается его, «оба» подходит честнее, чем «наверное, везде».
      options:
        - Настольное приложение (Windows)
        - Приставка (Android TV)
        - На обоих
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что неудобно сейчас
      description: Как вы обходитесь без этой возможности и чем это мешает.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Каким видите поведение
      description: Где это живёт в интерфейсе и что происходит по нажатию.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Чем этим управлять
      description: |
        На ПК — мышь и клавиатура: куда встаёт фокус, какая клавиша.
        На приставке — пульт: какими кнопками и откуда берётся фокус
        (`docs/dev/android-tv/ARCHITECTURE.md` в этом репозитории).
        На телефоне — пальцем: какие жесты и тач-цели.
        С телевизора экран читают с трёх метров, с монитора — с тридцати сантиметров,
        и требования к нему разные. Необязательно.
  - type: textarea
    id: extra
    attributes:
      label: Что ещё важно
      description: Ссылки, примеры из других проектов, наброски. Необязательно.
