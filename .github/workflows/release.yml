# Сборка и выкладка релиза приложения. Запуск только по тегу windows-v<версия>. По пушу в ветку
# сборка не идёт: каждый прогон — это полная компиляция Rust на windows-latest, а смысл она имеет
# только для выпуска.

name: release

on:
  push:
    tags:
      - 'windows-v*'

  # Ручной запуск — для прогона без выпуска: конвейер стоит проверить заранее
  # (Rust, Tauri, подпись). Пробный прогон собирает и подписывает, но ничего не
  # публикует. У приставки такой же режим: шаги публикации отсекаются условием.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпуска'
        required: true
        default: 'windows-v3.1.2'
      dry:
        description: 'Пробный прогон: собрать и подписать, но релиз не публиковать'
        type: boolean
        default: true

# Без этого токен прогона только читает, и создание релиза упадёт на 403.
permissions:
  contents: write

jobs:
  release:
    # Код настольного приложения лежит в apps/windows, а конвейер — в корне: GitHub читает
    # .github/workflows только оттуда. Каталог задаётся задачей, а не путями в командах.
    defaults:
      run:
        working-directory: apps/windows

    # Только Windows: целей сборки две — nsis и msi.
    runs-on: windows-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Node 24 — та же версия, что в ci.yml и release-tv.yml: lock генерирует
          # npm 11, а npm 10 из node 22 отвергает его на npm ci —
          # «Missing: esbuild@0.28.2 from lock file».
          node-version: 24
          cache: npm

      # Номер версии из имени тега и сверка с package.json. Номер берётся образцом, а не отрезанием
      # приставки: тег windows-v3.0 тихо дал бы странное имя портабл-архива вместо…
      - name: Номер версии из тега
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^windows-v(?<v>\d+\.\d+\.\d+)$') {
            throw "Имя тега '$tag' не подходит под windows-v<версия>"
          }
          $version = $Matches['v']
          $declared = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ($version -ne $declared) {
            throw "Номер в теге ($version) расходится с package.json ($declared)"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "version=$version"
          Write-Host "Выпуск приложения: $version (тег $tag)"

      # Текст верхнего раздела CHANGELOG уходит и в описание релиза, и в окно обновления внутри
      # приложения: апдейтер показывает пользователю ровно то, что лежит в поле notes манифеста.
      - name: Описание релиза из CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $marks = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match '^## \[' }
          if ($marks.Count -eq 0) {
            throw 'В CHANGELOG.md не найдено ни одного раздела вида "## [версия]"'
          }
          $from = $marks[0] + 1
          $to = if ($marks.Count -gt 1) { $marks[1] - 1 } else { $lines.Count - 1 }
          $body = ($lines[$from..$to] -join "`n").Trim()
          # Потолок на случай очень большого раздела: тело релиза уходит в манифест
          # обновлений, раздувать его нечем.
          if ($body.Length -gt 3000) {
            $body = $body.Substring(0, 3000).TrimEnd() + "`n`n…полный список изменений — в CHANGELOG.md"
          }
          # Подвал после обрезки, чтобы она его не съела: правовые документы на странице выпуска.
          $body = $body + "`n`n— Политика: https://github.com/foulnike/Animori/blob/main/docs/PRIVACY.md · Условия: https://github.com/foulnike/Animori/blob/main/docs/TERMS.md"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'body<<ANIMORI_NOTES'
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value 'ANIMORI_NOTES'
          Write-Host "Взято строк описания: $($to - $from + 1)"

      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Компиляция зависимостей Tauri с нуля — это минуты. Кэш привязан к Cargo.lock,
      # который у нас закоммичен, поэтому попадание будет стабильным.
      - name: Кэш Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      # Пустой секрет подписи лучше поймать здесь: на сборке он всплывает через минуты
      # компиляции и без намёка на то, что дело в секрете.
      - name: Проверка секретов подписи
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $missing = @()
          foreach ($v in 'TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($v))) { $missing += $v }
          }
          if ($missing) {
            Write-Output "::error::Пустые секреты подписи: $($missing -join ', '). Задать в Settings -> Secrets and variables -> Actions."
            exit 1
          }
          Write-Output 'Секреты подписи на месте.'

      # Нужны для beforeBuildCommand: сборку переднего края (npm run build:app) запускает сам
      # tauri-action перед компиляцией Rust.
      # Установка из корня: замок один на репозиторий, в каталоге приложения его нет.
      - name: Зависимости npm
        working-directory: .
        run: npm ci

      # Собирает приложение, создаёт релиз по тегу, подписывает установщик и сам генерирует
      # latest.json. Писать манифест вручную не надо.
      # Пробный прогон: сборка и подпись без публикации. tauri-action создаёт релиз
      # сам, поэтому в пробном режиме он не идёт вовсе, а сборка идёт напрямую через
      # tauri build. Отдельный шаг, а не флаг внутри: у tauri-action нет «собрать, не
      # выкладывая», и забытая отсечка публикует выпуск молча.
      - name: Пробный прогон, сборка и подпись без публикации
        if: github.event_name != 'push' && inputs.dry
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Сборка приложения и публикация релиза
        if: github.event_name == 'push' || !inputs.dry
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Проект переехал в apps/windows: без этого tauri-action искал бы его в корне
          # и не нашёл, то есть выпуск падал бы на самом первом шаге.
          projectPath: apps/windows
          # Ручной запуск идёт не по тегу: ref у него — ветка, и без подстановки
          # tauri-action выпустил бы релиз с тегом `main`.
          tagName: ${{ inputs.tag || github.ref_name }}
          # Платформа в названии: оба продукта живут в одном репозитории, и без неё
          # на странице Releases две строки «AniMori 3.1.2» не отличить. Название
          # ничего не ломает — апдейтеры смотрят на тег, а не на него.
          releaseName: AniMori ${{ steps.ver.outputs.version }} — Windows
          releaseBody: ${{ steps.notes.outputs.body }}
          # Черновик и предварительный релиз оба выключены: оба делают релиз невидимым для
          # подписчиков, а подписчик на Releases их не получает. Адрес `releases/latest`
          # больше не используется — канал обновлений Windows держит собственный релиз
          # windows-latest, см. последний шаг.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # По умолчанию (false) манифест берёт первый по приоритету установщик, а первый — как раз
          # msi: все установленные копии поставлены NSIS и пошли бы обновляться через msiexec…
          updaterJsonPreferNsis: true

      # Короткое имя для человека. Исходный файл остаётся на месте нетронутым — именно на него
      # ссылается latest.json.
      - name: Копия установщика под коротким именем
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setup = Get-ChildItem -Path src-tauri/target -Recurse -Filter *-setup.exe |
            Where-Object { $_.DirectoryName -match 'bundle\\nsis$' } |
            Select-Object -First 1
          if (-not $setup) {
            throw 'Установщик NSIS не найден — сборка что-то положила не туда'
          }
          Copy-Item $setup.FullName artifacts/AniMori_Setup.exe
          Write-Host "Исходный артефакт: $($setup.FullName)"

      # Портабл-версия. Отдельной цели сборки под неё у Tauri нет: приложение — один exe с
      # интерфейсом в бинарнике, но без WebView2 Runtime — предупреждение едет в README.md.
      - name: Портабл-архив
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Recurse -Filter AniMori.exe |
            Where-Object { $_.DirectoryName -match 'release$' } |
            Select-Object -First 1
          if (-not $exe) {
            throw 'AniMori.exe не найден в src-tauri/target'
          }
          $version = '${{ steps.ver.outputs.version }}'
          $stage = "portable/AniMori_$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage 'AniMori.exe')
          Copy-Item README.md (Join-Path $stage 'README.md')
          # LICENSE один на репозиторий и лежит в его корне, а не рядом с приложением:
          # им пользуются оба продукта.
          Copy-Item ../../LICENSE (Join-Path $stage 'LICENSE')
          # Перечень зависимостей с лицензиями: MPL-2.0 требует уведомления, а портабл
          # разбирают без репозитория под рукой — значит, перечень едет вместе с программой.
          Copy-Item ../../docs/THIRD-PARTY.md (Join-Path $stage 'THIRD-PARTY.md')
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/AniMori_${version}_x64-portable.zip" -Force
          Write-Host "Портабл собран из: $($exe.FullName)"

      # Пробный прогон сюда не доходит: сборка и подпись уже проверены, а публиковать нечего.
      - name: Доложить артефакты в релиз
        if: ${{ github.event_name == 'push' || !inputs.dry }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Пути от корня репозитория: JavaScript-шаги не знают про
          # defaults.run.working-directory, а копирующие шаги выше кладут файлы
          # в apps/windows/artifacts. Без префикса шаг искал бы их в корне и
          # выпустил бы релиз без переименованного установщика и портабла.
          files: |
            apps/windows/artifacts/AniMori_Setup.exe
            apps/windows/artifacts/AniMori_*_x64-portable.zip

      # Канал обновлений Windows: отдельный релиз с постоянным именем, всегда указывающий на
      # последнюю сборку. Зачем он нужен: апдейтер читает адрес по имени, а `releases/latest`
      # после появления выпусков приставки в этом же репозитории уезжал бы на них — и Windows
      # молча перестал бы находить обновление. Свой канал от такого не зависит.
      - name: Канал обновлений windows-latest
        # Шаг удаляет прежний канал и создаёт новый: в пробном прогоне он не должен
        # трогать живой канал обновлений у людей с уже установленной программой.
        if: ${{ github.event_name == 'push' || !inputs.dry }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel = 'windows-latest'
          $sha = '${{ github.sha }}'
          $tag = '${{ inputs.tag || github.ref_name }}'

          # Манифест берём из выпуска, а не ищем по файловой системе. tauri-action
          # выкладывает latest.json прямо в релиз и не оставляет его в src-tauri/target:
          # боевой прогон падал с «latest.json не найден», хотя манифест лежал в
          # выпуске и был подписан тем же ключом, что и установщик.
          #
          # Ищем его ДО удаления прежнего канала: заменять есть чем — проверяем раньше,
          # чем ломаем, иначе обновления у людей пропадут до ручной починки.
          New-Item -ItemType Directory -Force -Path manifest | Out-Null
          gh release download $tag --pattern 'latest.json' --dir 'manifest' --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Не удалось скачать latest.json из выпуска ${tag} — канал нечем наполнить"
          }
          $manifest = Get-ChildItem 'manifest' -Filter 'latest.json' | Select-Object -First 1
          if (-not $manifest) {
            throw 'Манифест не скачался — канал нечем наполнить'
          }

          # Прежний канал снимаем целиком вместе с тегом: оставить его — значит онить на
          # странице Releases выпуск с чужим манифестом.
          gh release delete $channel --yes --cleanup-tag 2>$null

          gh release create $channel --target $sha --prerelease `
            --title 'AniMori: канал обновлений Windows' `
            --notes 'Указатель на последний выпуск windows. Обновляется при каждом выпуске, вручную не править. Помечен предварительным, чтобы не занимать метку «последний выпуск» и не сбивать ручные ссылки на установщик.'

          # Манифест берём из вывода сборки того же прогона: он подписан тем же ключом, что и
          # сам установщик, и подменять его своим нельзя.
          gh release upload $channel $manifest.FullName --clobber
          Write-Host "Манифест канала взят из $($manifest.FullName)"

          # Проверка тем адресом, который читает апдейтер: канал без этого шага может
          # остаться пустым, и обновления перестанут приходить без единой ошибки в сборке.
          $url = 'https://github.com/${{ github.repository }}/releases/download/' + $channel + '/latest.json'
          try {
            $check = Invoke-RestMethod -Uri $url -TimeoutSec 30
            Write-Host "Канал отвечает, версия в манифесте: $($check.version)"
          } catch {
            throw "Канал $url не отдаёт манифест: $($_.Exception.Message)"
          }
