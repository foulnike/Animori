# Проверки на каждый пуш. Gradle и сборщик APK здесь не трогаются: это чтение
# файлов, проверка типов, vitest и Rust-слой — cargo check / clippy / fmt на оба
# src-tauri. Полная сборка живёт в release.yml и release-tv.yml и ходит по тегу.
#
# Пока эти задачи не существовали, наборы vitest не гонял вообще никто: проверки
# краснели и тихо ждали ручного прогона. Так в приставке и дожили до семнадцати
# падений, которые заметили через две ревизии.
#
# Сторож расхождений ядра удалён вместе с дублированием: ядро теперь одно,
# и сверять его больше не с чем.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Проверки только читают: ни ветку, ни выпуск, ни настройки они не трогают.
# Без блока токен прогона берётся шире нужного, и у задач остаются права на запись
# там, где им нечего писать. В выпусках нужно обратное — там `contents: write`,
# см. release.yml и release-tv.yml.
permissions:
  contents: read

jobs:
  # Наборы общего ядра: одни на оба продукта, потому что ядро одно.
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Единая версия Node во всех трёх задачах — 24, как на машине разработчика:
      # lock генерирует npm 11 из этой версии, а npm 10 из node 20/22 отвергает
      # его при npm ci (требует peer esbuild у вложенного vite 8 и не находит
      # его в lock). Раньше здесь стояли 22/20/22 — это и было причиной падения
      # «Missing: esbuild@0.28.2 from lock file».
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      # Формат: без этого шага договорённость о стиле держалась только на памяти,
      # и Prettier молча пропускал старые файлы. Проверка одна на весь репозиторий.
      - name: Формат
        run: npm run format:check

      # Расхождение копий между продуктами: ловит правку, доехавшую только до одного края.
      # Различие само по себе не ошибка — падает лишь рост сверх зафиксированного.
      - name: Расхождение копий
        run: npm run drift

      # Команды оболочки и алиасы правятся в нескольких местах, но обязаны совпадать.
      # Расхождение ловится здесь, а не отказом в рантайме.
      - name: Синхронность конфигураций
        run: npm run sync:check

      - name: Наборы ядра
        run: npm run test:core

  # Настольное приложение: экранные наборы и граница ядра.
  #
  # Установка всегда из корня: замок один на репозиторий, и в каталоге приложения
  # его нет — `npm ci` там падает. Рабочие области поднимают всё в корневой
  # node_modules, откуда приложение и берёт зависимости.
  windows:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        working-directory: apps/windows
        run: npm run typecheck:all

      - name: Линтер
        run: npm run lint

      - name: Наборы экранов
        working-directory: apps/windows
        run: npm test

  # Приставка: свой экран, тот же код ядра.
  android-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        working-directory: apps/android-tv
        run: npm run typecheck:all

      - name: Линтер
        run: npm run lint

      - name: Наборы экранов
        working-directory: apps/android-tv
        run: npm test

  # Мобильное приложение: свой экран, тот же код ядра.
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка типов
        working-directory: apps/android
        run: npm run typecheck:all

      - name: Линтер
        run: npm run lint

      - name: Наборы экранов
        working-directory: apps/android
        run: npm test

  # Rust-слой: оба src-tauri раньше компилировались только на релизном теге, и
  # ошибка компиляции находилась в момент выпуска, а не на пуше. Проверки идут
  # на Windows: боевой код (proxy_auth, webview2) живёт под cfg(windows) и на
  # Linux не компилируется вовсе, а wry на Linux тянул бы системный webkit2gtk.
  #
  # Матрица по продуктам, а не один job с двумя каталогами: падение одного crate
  # не должно прятать падение другого. fail-fast выключен — сначала видим обе картины.
  rust:
    strategy:
      fail-fast: false
      matrix:
        app: [windows, android-tv, android]

    runs-on: windows-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Окружение Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt

      # Компиляция зависимостей Tauri с нуля — минуты. Ключ матричный: job-id и
      # хэш Cargo.lock у обеих строк общие, и без `key` они делили бы один кэш,
      # затирая target-каталог друг друга. Порядок важен: кэш привязывается к
      # версии rustc из текущего окружения, поэтому ставится после тулчейна.
      - name: Кэш Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
          key: ${{ matrix.app }}

      # generate_context! читает frontendDist на этапе компиляции, а dist/ в
      # .gitignore — на свежем чекауте каталога нет и check падает. Собранный
      # фронт для проверки Rust не нужен: макросу достаточно, чтобы каталог существовал.
      - name: Заглушка каталога сборки
        run: New-Item -ItemType Directory -Force dist/app | Out-Null
        working-directory: apps/${{ matrix.app }}

      # Формат первым: он не компилирует и отдаёт результат за секунды.
      # Дальше check — дешевле clippy; clippy --all-targets покрывает и тесты.
      - name: Формат
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo fmt --check

      - name: Проверка компиляции
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo check --workspace

      # Юнит-тесты чистой логики: валидация путей (export), разбор прокси (proxy),
      # пропуск и nonce (auth), тела запросов к AniList (anilist). Падение тестов
      # валит задачу — раньше эта логика не проверялась вовсе.
      - name: Тесты
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo test --workspace

      - name: Линт
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Лицензии и запреты двух Cargo.lock: расхождение здесь, а не инцидентом
      # у пользователя. Конфиг — deny.toml в корне, ищется восхождением от
      # каталога манифеста. Официальный cargo-deny-action — контейнерный и на
      # windows-latest не стартует («Container action is only supported on
      # Linux»), поэтому бинарь ставит install-action — JS-действие.
      - name: Установка cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2

      - name: Запреты и лицензии
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo deny check bans licenses sources

      # Уязвимости отдельно: свежий advisory виден, но общий прогон не роняет.
      - name: Уязвимости
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo deny check advisories
        continue-on-error: true
